<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Let Billions of People See What Your Friends, Colleagues and Business Partners Think About You in One Place - Onebrb</title>
    <base href="/">
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/default-base.css">
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/default.css">
    <script src="bootstrap.bundle.min.js"></script>
    <link href="_content/Blazored.Toast/blazored-toast.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap-icons.css">
    <link href="Onebrb.SPA.styles.css" rel="stylesheet" />
    <script src="/scripts.js"></script>
    <!--<link rel="stylesheet" href="_content/BytexDigital.Blazor.Components.CookieConsent/styles.min.css" />-->
</head>

<body>
    <div id="app">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script>
        window.appCulture = {
            get: () => window.localStorage['AppLanguage'],
            set: (value) => window.localStorage['AppLanguage'] = value
        };
    </script>
    <script>
        window.employeeData = {
            get: () => window.localStorage['empData'],
            set: (value) => window.localStorage['empData'] = value
        };

        window.clipboardCopy = {
            copyText: function (text) {
                navigator.clipboard.writeText(text).then(function () {
                })
                    .catch(function (error) {
                        alert(error);
                    });
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './decode.js';
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                console.log("type: " + type)
                console.log("name: " + name)
                console.log("defaultUri: " + type)
                console.log("integrity: " + integrity)

                if (type !== 'dotnetjs' && location.hostname !== 'localhost') {
                    return (async function () {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok) {
                            throw new Error(response.statusText);
                        }
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        const contentType = type ===
                            'dotnetwasm' ? 'application/wasm' : 'application/octet-stream';
                        return new Response(decompressedResponseArray,
                            { headers: { 'content-type': contentType } });
                    })();
                }
            }
        });
    </script>
</body>

</html>
